<div class="nav-left">
  {% if page.id == 'home' %}
  <a href="/" aria-label="Andreas Thoma - Home">Andreas Thoma</a>
  {% else %}
  <button
    class="circle-btn nav-back-btn"
    onclick="handleNavBack(event)"
    aria-label="Go back"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="14"
      height="14"
      viewBox="0 0 14 14"
      fill="none"
    >
      <path
        d="M3.52342 8.06639L7.99341 12.5364L6.81508 13.7147L0.333422 7.23306L6.81508 0.7514L7.99341 1.9297L3.52342 6.39972H13.6667V8.06639H3.52342Z"
        fill="currentColor"
      />
    </svg>
  </button>
  {% endif %}
</div>

<script>
  var NAV_SCROLL_RESET_KEY = "nav:reset-scroll-on-back";

  // sessionStorage can throw when storage is blocked; never let that break the button.
  function readFlag() {
    try {
      return sessionStorage.getItem(NAV_SCROLL_RESET_KEY) === "1";
    } catch {
      return false;
    }
  }

  function writeFlag(on) {
    try {
      if (on) sessionStorage.setItem(NAV_SCROLL_RESET_KEY, "1");
      else sessionStorage.removeItem(NAV_SCROLL_RESET_KEY);
    } catch {
      // Ignore: scroll reset is a nicety.
    }
  }

  function resetScrollToTop() {
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
  }

  if (readFlag()) {
    writeFlag(false);

    // Browsers may restore scroll after scripts run, so force the reset on
    // multiple lifecycle points.
    if ("scrollRestoration" in window.history) {
      window.history.scrollRestoration = "manual";
    }

    resetScrollToTop();
    requestAnimationFrame(resetScrollToTop);
    setTimeout(resetScrollToTop, 0);

    window.addEventListener("load", resetScrollToTop, { once: true });
  }

  // Pages restored from bfcache don't re-run scripts, so handle the flag here.
  window.addEventListener("pageshow", function (event) {
    if (event.persisted && readFlag()) {
      writeFlag(false);
      resetScrollToTop();
    }
  });

  // In-page hash links (e.g. the skip link) add history entries on the same
  // page. Track how many so the back button leaves the page, not the hash.
  var navHashDepth = (window.history.state && window.history.state.navHashDepth) || 0;
  if (!window.history.state || typeof window.history.state.navHashDepth !== "number") {
    window.history.replaceState(
      Object.assign({}, window.history.state, { navHashDepth: navHashDepth }),
      ""
    );
  }

  window.addEventListener("hashchange", function () {
    var state = window.history.state;
    if (state && typeof state.navHashDepth === "number") {
      navHashDepth = state.navHashDepth;
    } else {
      navHashDepth += 1;
      window.history.replaceState(
        Object.assign({}, state, { navHashDepth: navHashDepth }),
        ""
      );
    }
  });

  function handleNavBack(event) {
    if (event) {
      event.preventDefault();
    }

    var hasSameOriginReferrer = false;

    if (document.referrer) {
      try {
        hasSameOriginReferrer =
          new URL(document.referrer).origin === window.location.origin;
      } catch {
        hasSameOriginReferrer = false;
      }
    }

    if (hasSameOriginReferrer && window.history.length > navHashDepth + 1) {
      writeFlag(true);
      window.history.go(-(navHashDepth + 1));
      return;
    }

    window.location.assign("/");
  }
</script>
